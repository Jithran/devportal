<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevPortal</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="stylesheet" href="app.css">
  <script src="theme.js"></script>
</head>
<body>
  <header class="bar">
    <a class="brand" href="/"><img src="favicon.svg" alt="" width="26" height="26"><span>DevPortal</span></a>
    <input id="search" type="search" placeholder="Search project, branch, port, title, process…" aria-label="Search" autofocus>
    <div class="right">
      <span class="scan muted"><span class="pulse"></span><span id="updated"></span></span>
      <button id="theme" type="button" aria-label="Toggle theme">Theme</button>
    </div>
  </header>
  <div id="offline" class="notice busy" role="status" hidden>DevPortal is restarting or stopped. Reconnecting…</div>
  <div id="docker-error" class="notice" hidden></div>
  <main class="wrap">
    <section id="kpis" class="kpis" aria-label="Summary"></section>
    <div class="main">
    <div class="content">
    <div class="toolbar">
      <div class="tabs" role="tablist" aria-label="View">
        <button id="tab-projects" type="button" role="tab" aria-controls="projects" aria-selected="true">Projects <span id="count-projects" class="count"></span></button>
        <button id="tab-ports" type="button" role="tab" aria-controls="view-ports" aria-selected="false" tabindex="-1">All ports <span id="count-ports" class="count"></span></button>
      </div>
      <div id="filters" class="filters"></div>
      <label class="chip system"><input id="show-system" type="checkbox"> Show system</label>
    </div>
    <div id="projects" role="tabpanel" aria-labelledby="tab-projects" aria-busy="true"><p class="muted">Loading…</p></div>
    <div id="view-ports" role="tabpanel" aria-labelledby="tab-ports" hidden>
      <p class="muted">Loading…</p>
    </div>
    </div>
    <aside class="rail" aria-label="Overview">
      <section class="card" aria-labelledby="attention-h">
        <h3 id="attention-h">Needs attention <span id="attention-count" class="badge neutral"></span></h3>
        <ul id="attention" class="alerts"></ul>
        <div id="attention-foot" class="alerts-foot" hidden></div>
      </section>
      <section class="card" aria-labelledby="mix-h">
        <h3 id="mix-h">Ports by type <span id="mix-total" class="muted"></span></h3>
        <div id="mix" class="mix"></div>
      </section>
      <section class="card" aria-labelledby="rt-h">
        <h3 id="rt-h">Response time · all endpoints <span id="rt-span" class="muted"></span></h3>
        <div id="rt" class="chartbox"></div>
      </section>
    </aside>
    </div>
  </main>
  <footer class="foot">
    <span>DevPortal <strong id="version"></strong></span>
    <span>localhost only · read-only</span>
    <span class="links"><a id="release-notes" rel="noopener noreferrer" target="_blank">Release notes</a> · <a id="repository" rel="noopener noreferrer" target="_blank">GitHub</a></span>
  </footer>
  <script src="stats.js"></script>
  <script src="ports.js"></script>
  <script src="spark.js"></script>
  <script src="attention.js"></script>
  <script src="app.js"></script>
</body>
</html>
